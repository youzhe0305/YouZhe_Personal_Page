# Projects shown on index.html — displayed in the order they appear in this file.
#
# title:        project name (quote it if it contains ": ")
# short:        short name; [[short]] in news.yaml becomes a colored box linking here
# url:          optional — makes the title a link
# date:         "YYYY-MM" (quoted), shown on the card
# event:        optional, shown after the date, e.g. "YTP Hackathon"
# image:        thumbnail (16:9 crop; click enlarges it)
# description:  understands **bold** and [text](url); long text gets a "Read more" button
# selected:     true → shown under "Selected" (the default view); "All" shows every project
# links:        label: url, in display order. Known labels get icons:
#               Page, Project Page, Code, Video, Demo, Poster, arXiv, Dataset

- title: "ShellBench: A Parametric Shell Game Benchmark for Memory-Aware Manipulation"
  short: ShellBench
  url: https://www.youzhexie.me/projects/ShellBench/index.html
  selected: true
  date: "2026-06"
  image: images/shell_game.gif
  description: >-
    A parametric Isaac Sim benchmark that measures a policy's long-term memory with a shell game: a ball
    hidden under shuffled identical cups forces reliance on memory over current observations.
    Configurable cups, shuffles, and speed yield quantitative memory-capacity curves.
  links:
    Page: https://www.youzhexie.me/projects/ShellBench/index.html
    Code: https://github.com/NYCU-AI-Capstone/Advanced-level

- title: "Designing Fun: LLM-based Game Level Generation via Agent Gameplay Feedback"
  short: Designing Fun
  url: https://tsaipercy.github.io/RL_final_Project-Page/
  selected: true
  date: "2026-06"
  image: images/designing_fun.gif
  description: >-
    Trains an LLM to generate fun MiniGrid levels with a two-stage SFT + GRPO framework. "Fun" is
    decomposed into three gameplay-grounded rewards — regret (skill discrimination), interaction
    richness, and diversity — optimized through agent playthroughs. Beats vanilla and SFT baselines on
    all metrics; ablations confirm each reward's contribution.
  links:
    Page: https://tsaipercy.github.io/RL_final_Project-Page/
    Code: https://github.com/Yu-Hsuan-1220/RL_Final_Project

- title: "MATCHA: Match with Agent"
  short: MATCHA
  url: https://github.com/racercode/MATCHA
  selected: true
  date: "2026-04"
  event: YTP Hackathon
  image: images/MATCHA.png
  description: >-
    A multi-agent career-resource matching system where AI agents socialize on behalf of users. Each
    personal agent learns the user's background, talks with government-resource agents and other users'
    agents, and brings back opportunities and peer experiences — combining RAG-based policy matching,
    Coffee Chat discovery, and a government dashboard to turn passive searching into active matching.
  links:
    Code: https://github.com/racercode/MATCHA

